info:
  name: keychain
  debug: true
  description: Keychain Application to store and retrieve secrets

  api:
    allow_credentials: true
    allow_origins: ["*"]
    allow_methods: ["*"]
    allow_headers: ["*"]

db:
  alembic_ini_path: "__alembic_ini_path__"
  provider: postgresql
  host: db
  port: 5432
  name: "__db_name__"
  user: "__user__"
  password: "__password__"
  backup_folder_path: backup
  backup_count: 5

cryptography:
  secret_key: "__secret_key__"

auth:
  jwt_secret_key: "__jwt_secret_key__"
  algorithm: HS256
  access_token_expire_minutes: 480 # 8 hours