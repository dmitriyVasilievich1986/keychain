environment: "production"

info:
  name: keychain
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"
  debug: false
  description: Keychain Application to store and retrieve secrets

  api:
    api_prefix: "/keychain"
    allow_credentials: true
    allow_origins:
      - "*"
    allow_methods:
      - "*"
    allow_headers:
      - "*"

db:
  firestore:
    db_name: "Put your Firestore database name here"
    collection_name: "Put your Firestore collection name here"
  users:
    db_name: "Put your Firestore database name here"
    collection_name: "users"

google:
  project_id: "Put your Google project ID here"
  # Path to a service account key file; null uses Application Default Credentials
  # (e.g. the service account attached to the Cloud Run service).
  credentials_path: null

cryptography:
  secret_key: "Put your secret key here"

auth:
  jwt_secret_key: "Put your JWT secret key here"
  algorithm: HS256
  access_token_expire_minutes: 480 # 8 hours
