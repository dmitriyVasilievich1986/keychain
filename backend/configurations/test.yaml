environment: "test"

info:
  name: keychain
  host: "0.0.0.0"
  port: 8080
  debug: true
  description: Keychain Application to store and retrieve secrets

  api:
    api_prefix: "/keychain"
    allow_credentials: true
    allow_origins:
      - "*"
    allow_methods:
      - "*"
    allow_headers:
      - "*"

  logs:
    log_level: "DEBUG"
    is_simple_output: true
    logs_folder_path: null

db:
  alembic_ini_path: "backend/src/keychain/services/alembic/alembic.ini"
  backup_folder_path: "backup"
  backup_count: 5
  postgresql:
    provider: postgresql+asyncpg
    host: db
    port: 5432
    name: "test_db"
    user: "Put your database user here"
    password: "Put your database password here"

cryptography:
  secret_key: "Put your secret key here"

auth:
  jwt_secret_key: "Put your JWT secret key here"
  algorithm: HS256
  access_token_expire_minutes: 480 # 8 hours
