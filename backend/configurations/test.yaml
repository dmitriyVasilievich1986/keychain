environment: "test"

info:
  name: keychain
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"
  debug: true
  description: Keychain Application to store and retrieve secrets

  api:
    api_prefix: "/keychain"
    allow_credentials: true
    allow_origins:
      - "*"
    allow_methods:
      - "*"
    allow_headers:
      - "*"

db:
  firestore:
    db_name: "(default)"
    collection_name: "password"
  users:
    db_name: "(default)"
    collection_name: "users"

google:
  # Tests run against the Firestore emulator (FIRESTORE_EMULATOR_HOST), so no
  # credentials file is needed.
  project_id: "keychain-test"

cryptography:
  secret_key: "Put your secret key here"

auth:
  jwt_secret_key: "Put your JWT secret key here"
  algorithm: HS256
  access_token_expire_minutes: 480 # 8 hours
