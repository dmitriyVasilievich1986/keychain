info:
  name: keychain-test
  debug: false
  description: Keychain test configuration

  api:
    allow_credentials: true
    allow_origins: ["*"]
    allow_methods: ["*"]
    allow_headers: ["*"]

db:
  alembic_ini_path: src/keychain/services/alembic/alembic.ini
  provider: postgresql
  host: localhost
  port: 5432
  name: test_db
  user: root
  password: root
  backup_folder_path: backups
  backup_count: 5

auth:
  jwt_secret_key: test-secret
  algorithm: HS256
  access_token_expire_minutes: 30
