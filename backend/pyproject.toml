[project]
name = "keychain"
dynamic = ["version"]
keywords = ["password", "encryption", "keychain"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13"

authors = [{ email = "dmitriyvasil@gmail.com" }]
maintainers = [{ email = "dmitriyvasil@gmail.com" }]
description = "Simple keychain service to store and retrieve secrets"

readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.17.1",
    "asyncclick>=8.4.2.1",
    "asyncpg>=0.31.0",
    "colorama>=0.4.6",
    "cryptography>=46.0.3",
    "fastapi>=0.121.0",
    "greenlet>=3.2.4",
    "loguru>=0.7.3",
    "pydantic>=2.12.4",
    "pydantic-settings[yaml]>=2.11.0",
    "pyjwt>=2.10.1",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn>=0.38.0",
    "werkzeug>=3.1.3",
]

[dependency-groups]
dev = [
    "dotenv>=0.9.9",
    "ipykernel>=7.3.0",
    "pyright[nodejs]>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/keychain/__init__.py"

[project.urls]
Homepage = "https://github.com/dmitriyVasilievich1986/keychain"

[project.scripts]
keychain = "keychain.utils.cli.main:main"

[tool.ruff]
line-length = 120

# exclude ipynb files
extend-exclude = ["*.ipynb"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "A",     # flake8-builtins (A)
    "ARG",   # flake8-unused-arguments (ARG)
    "ASYNC", # flake8-async (ASYNC)
    "PTH",   # flake8-use-pathlib (PTH)
    "B",     # flake8-bugbear (B)
    "E",     # pycodestyle (E, W)
    "F",     # Pyflakes (F)
    "N",     # pep8-naming (N)
    "W",     # pycodestyle (E, W)
    "RUF",
    "SLF",   # flake8-self (SLF)
    "RET",   # flake8-return (RET)
    "Q",     # flake8-quotes (Q)
    "T20",   # flake8-print (T20)
    "COM",   # flake8-commas (COM)
    "D",     # pydocstyle (D)
    "FIX",   # flake8-fixme (FIX)
]
ignore = [
    "E712",
    "RUF001",
    "N817",
    "N814",
    "RUF100",
    "D100",
    "D101",
    "D104",
    "D401",
    "D203",
    "D213",
    "COM812",
]

extend-select = ["I"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
force-sort-within-sections = false
known-first-party = ["cerebra_auth", "cerebra_common"]
lines-after-imports = -1
order-by-type = false
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
known-third-party = [
    "aiosqlite",
    "alembic",
    "click",
    "colorama",
    "cryptography",
    "fastapi",
    "greenlet",
    "loguru",
    "pydantic",
    "pydantic_settings",
    "ruff",
    "uvicorn",
    "werkzeug",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = [
    "-vvv",
    "--strict-markers",
    "--tb=short",
    "--cov=src/keychain",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "asyncio: mark test as an async test",
    "slow: mark test as slow running",
    "integration: mark test as integration test",
    "api: mark test as an API endpoint test",
]

[tool.coverage.run]
source = ["src/keychain"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/migrations/*",
    "*/alembic/*",
    "*/utils/cli/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "*.ipynb"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
