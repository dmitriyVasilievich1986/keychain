name: Tag and Docker push

# Runs when a PR is merged into development and bumps the patch version.
# A PR commit with subject "version(application): X.Y.Z[-suffix]" overrides the bump.
#
# Stages run strictly in order; each one must succeed for the next to start:
#   version -> build -> tag -> push-images
#
# Publishing a GitHub release for a tag lives in github_release.yml.

on:
  pull_request:
    types: [closed]
    branches: [development]

# Merges into development are tagged one at a time, in order.
concurrency:
  group: tag-docker-push
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Calculate version
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Get PR commit messages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Messages are separated by the ASCII record separator (\u001e) so
        # multi-line commit messages stay intact.
        run: |
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/commits" \
            --jq '.[] | .commit.message + "\u001e"' > "${RUNNER_TEMP}/commits.txt"

      - name: Calculate version
        id: calc
        run: |
          python .github/scripts/calculate_version.py \
            --commits "${RUNNER_TEMP}/commits.txt"

      - name: Summary
        env:
          VERSION: ${{ steps.calc.outputs.version }}
        run: |
          echo "### Version: \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build_docker.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      version: ${{ needs.version.outputs.version }}

  tag:
    name: Create git tag
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Create and push tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" "${SHA}" -m "Release ${VERSION} (PR #${PR_NUMBER})"
          git push origin "refs/tags/${VERSION}"

  push-images:
    name: Push images
    needs: [version, tag]
    # Opt-in: runs only while the repository variable PUSH_IMAGES is "true"
    # (Settings -> Secrets and variables -> Actions -> Variables).
    if: vars.PUSH_IMAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      # The image reads its application version from git tags in .git, and the
      # checkout has no tags, so add the version tag locally (as build_docker.yml does).
      - name: Add local version tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: git tag "${VERSION}"

      # Docker image names must be lowercase; the GitHub owner name may not be.
      # The image is tagged with its version and with "latest". A pre-release
      # version (one with a "-suffix", e.g. 1.2.0-rc1) does not move "latest".
      - name: Compute image tags
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          owner="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/keychain-backend"
          tags="${image}:${VERSION}"
          if [[ "${VERSION}" != *-* ]]; then
            tags="${tags},${image}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      # QEMU lets the amd64 runner build the arm64 image too.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN can push to this repository's GHCR packages; no secret needed.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # One tag serves both Intel/AMD hosts and ARM hosts (e.g. Apple Silicon);
          # keep this list in sync with build_docker.yml.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          # Reuses the layers cached by the build stage.
          cache-from: type=gha,scope=backend

      - name: Summary
        env:
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          echo "### Pushed images" >> "$GITHUB_STEP_SUMMARY"
          for tag in ${TAGS//,/ }; do
            echo "- \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"
          done
