name: build-frontend

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect frontend changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/build_frontend.yml'

      - name: Skip frontend build (no relevant changes)
        if: steps.changes.outputs.frontend != 'true'
        run: echo "No frontend or workflow changes; marking check successful."

      - name: Setup Node.js
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # package.json devEngines.packageManager pins npm@12.0.1; npm does not
      # implement onFail:"download", so CI must install that version explicitly.
      - name: Setup npm
        if: steps.changes.outputs.frontend == 'true'
        run: npm install -g npm@12.0.1

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./frontend
        run: npm ci

      - name: Build project
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: steps.changes.outputs.frontend == 'true'
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 30
