name: build-frontend

# Reusable stage: called from pipeline.yml, which decides when it runs.

on:
  workflow_call:

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # package.json devEngines.packageManager pins npm@12.0.1; npm does not
      # implement onFail:"download", so CI must install that version explicitly.
      - name: Setup npm
        run: npm install -g npm@12.0.1

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build project
        working-directory: ./frontend
        run: npm run build

      # vite.config.ts builds into ../static (relative to frontend/), i.e. the
      # repository-root static/ directory, not frontend/dist/.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: static/
          if-no-files-found: error
          retention-days: 30
