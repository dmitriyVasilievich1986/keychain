name: test-backend

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect backend changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/test_backend.yml'

      - name: Skip backend tests (no relevant changes)
        if: steps.changes.outputs.backend != 'true'
        run: echo "No backend or workflow changes; marking check successful."

      - name: Set up Python
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        if: steps.changes.outputs.backend == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        if: steps.changes.outputs.backend == 'true'
        working-directory: ./backend
        run: uv sync --all-groups

      - name: Run tests with coverage
        if: steps.changes.outputs.backend == 'true'
        working-directory: ./backend
        env:
          DB__HOST: localhost
          DB__PORT: "5432"
          DB__USER: root
          DB__PASSWORD: root
        run: uv run pytest

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        if: steps.changes.outputs.backend == 'true' && always()
        with:
          name: coverage-report
          path: backend/htmlcov/
          retention-days: 7
