name: test-backend

# Reusable stage: called from pipeline.yml, which decides when it runs.

on:
  workflow_call:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --all-groups

      - name: Run tests with coverage
        working-directory: ./backend
        env:
          DB__POSTGRESQL__HOST: localhost
          DB__POSTGRESQL__PORT: "5432"
          DB__POSTGRESQL__USER: root
          DB__POSTGRESQL__PASSWORD: root
        run: uv run pytest

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/htmlcov/
          retention-days: 7
