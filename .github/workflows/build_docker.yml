name: build-docker

# Reusable stage: builds the backend Docker image without pushing it.
# Called from tag_docker_push.yml with the calculated version before that
# version is tagged.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (defaults to the triggering commit)
        type: string
        default: ""
      version:
        description: >-
          Application version baked into the image. Empty for a check build,
          which then uses the latest tag in the checkout (0.0.0 if none).
        type: string
        default: ""

jobs:
  build-docker:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      # The image reads its application version from git tags in .git
      # (scripts/generate-application-version.sh). The real tag is pushed only
      # after a successful build, so add it locally for the build to pick up.
      - name: Add local version tag
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: git tag "${VERSION}"

      # Docker image names must be lowercase; the GitHub owner name may not be.
      - name: Compute image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version || 'check' }}
        run: |
          owner="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=ghcr.io/${owner}/keychain-backend:${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # The backend Dockerfile lives at the repository root and copies
      # ./backend, ./scripts and ./.git, so the context is the repository root.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=backend
          # GitHub may hand this job a read-only cache token, so a failed cache
          # upload must not fail the build itself.
          cache-to: type=gha,mode=max,scope=backend,ignore-error=true
