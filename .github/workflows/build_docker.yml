name: build-docker

# Reusable stage: builds the backend Docker image for linux/amd64 and
# linux/arm64, and optionally pushes it to GitHub Container Registry and,
# when the GCP_* repository variables are set, to Google Artifact Registry.
# Called from tag_docker_push.yml twice: once to check the build before the
# version is tagged, and once with `push: true` to publish it.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (defaults to the triggering commit)
        type: string
        default: ""
      version:
        description: >-
          Application version baked into the image. Empty for a check build,
          which then uses the latest tag in the checkout (0.0.0 if none).
        type: string
        default: ""
      push:
        description: >-
          Push the image to ghcr.io (and Artifact Registry, see below). The
          caller must grant `packages: write` and, for Artifact Registry,
          `id-token: write`.
        type: boolean
        default: false

jobs:
  build-docker:
    name: ${{ inputs.push && 'Build and push backend image' || 'Build backend image' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      # The image reads its application version from git tags in .git
      # (scripts/generate-application-version.sh). The checkout has no tags,
      # and the real tag may not be pushed yet, so add it locally.
      - name: Add local version tag
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: git tag "${VERSION}"

      # Docker image names must be lowercase; the GitHub owner name may not be.
      # The image is tagged with its version and with "latest". A pre-release
      # version (one with a "-suffix", e.g. 1.2.0-rc1) does not move "latest".
      # Artifact Registry gets the same tags when the repository variable
      # GCP_BACKEND_IMAGE is set (terraform output backend_image).
      - name: Compute image tags
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
          GCP_IMAGE: ${{ inputs.push && vars.GCP_BACKEND_IMAGE || '' }}
        run: |
          owner="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          images=("ghcr.io/${owner}/keychain-backend")
          if [[ -n "${GCP_IMAGE}" ]]; then
            images+=("${GCP_IMAGE}")
            echo "gcp_registry=${GCP_IMAGE%%/*}" >> "$GITHUB_OUTPUT"
          fi
          tags=()
          for image in "${images[@]}"; do
            tags+=("${image}:${VERSION:-check}")
            if [[ -n "${VERSION}" && "${VERSION}" != *-* ]]; then
              tags+=("${image}:latest")
            fi
          done
          echo "tags=$(IFS=,; echo "${tags[*]}")" >> "$GITHUB_OUTPUT"

      # QEMU lets the amd64 runner build the arm64 image too.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN can push to this repository's GHCR packages; no secret needed.
      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Workload Identity Federation: exchanges the job's GitHub OIDC token for
      # a short-lived access token of the GCP_SERVICE_ACCOUNT service account
      # (terraform/modules/github_actions). No key is stored in GitHub.
      - name: Authenticate to Google Cloud
        id: gcp-auth
        if: steps.image.outputs.gcp_registry != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Google Artifact Registry
        if: steps.image.outputs.gcp_registry != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.image.outputs.gcp_registry }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      # The backend Dockerfile lives at the repository root and copies
      # ./backend, ./scripts and ./.git, so the context is the repository root.
      # One tag serves both Intel/AMD hosts and ARM hosts (e.g. Apple Silicon).
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=backend
          # GitHub may hand this job a read-only cache token, so a failed cache
          # upload must not fail the build itself.
          cache-to: type=gha,mode=max,scope=backend,ignore-error=true

      - name: Summary
        if: inputs.push
        env:
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          echo "### Pushed images" >> "$GITHUB_STEP_SUMMARY"
          for tag in ${TAGS//,/ }; do
            echo "- \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"
          done
