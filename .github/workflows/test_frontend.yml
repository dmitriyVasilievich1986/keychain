name: test-frontend

# Reusable stage: called from pipeline.yml, which decides when it runs.

on:
  workflow_call:

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # package.json devEngines.packageManager pins npm@12.0.1; npm does not
      # implement onFail:"download", so CI must install that version explicitly.
      - name: Setup npm
        run: npm install -g npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint:check

      - name: Run type checker
        run: npm run typecheck

      # Vitest via Vite+ (`vp test run`): a single run, no watch mode.
      - name: Run tests
        run: npm test
