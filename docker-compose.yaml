services:
  nginx:
    image: keychain-nginx:latest
    container_name: keychain-nginx
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - keychain-network
    depends_on:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "--no-check-certificate",
          "https://127.0.0.1/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:18
    container_name: keychain-db
    env_file:
      - path: ./backend/db.env
        required: true
    volumes:
      - ./db/data:/var/lib/postgresql
    networks:
      - keychain-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    # Published by .github/workflows/tag_docker_push.yml on every merge into development.
    # Run `docker compose -f docker-compose.yaml pull backend` to get the newest image.
    image: ghcr.io/dmitriyvasilievich1986/keychain-backend:latest
    container_name: keychain-backend
    env_file:
      - path: ./backend/.env
        required: true
      - path: ./backend/db.env
        required: false
    environment:
      - ENVIRONMENT=production
    volumes:
      - ./backup:/opt/backend/backup
    networks:
      - keychain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/keychain/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  keychain-network:
    external: false
