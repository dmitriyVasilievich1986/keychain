services:
  nginx:
    image: nginx:stable-alpine
    container_name: keychain-nginx
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - frontend-static:/usr/share/nginx/html/static:ro
    networks:
      - keychain-network
    depends_on:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "--no-check-certificate",
          "https://127.0.0.1/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    image: keychain:latest
    container_name: keychain-backend
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      - ENVIRONMENT=production
    volumes:
      - frontend-static:/opt/backend/static
    networks:
      - keychain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  frontend-static:

networks:
  keychain-network:
    external: false
