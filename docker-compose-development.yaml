# Local development stack.
#
#   docker compose -f docker-compose-development.yaml up                              # db only
#   docker compose -f docker-compose-development.yaml --profile backend up --build    # db + backend
#   docker compose -f docker-compose-development.yaml --profile frontend run --rm frontend
#
# PostgreSQL is exposed on localhost:5432 and always starts. The backend is built
# for the host architecture and exposed on localhost:8080; it runs only with the
# `backend` profile. The `frontend` service only builds the bundle into ./static
# and exits; it runs only with the `frontend` profile.
name: keychain-development

services:
  db:
    image: postgres:18
    env_file:
      - path: ./backend/db.env
        required: true
    environment:
      # Only applied when the data folder is initialised for the first time
      POSTGRES_DB: keychain_development
    ports:
      - 5432:5432
    volumes:
      # Separate from the production stack's ./db/data
      - ./db/data-development:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: keychain:development
    profiles:
      - backend
    env_file:
      - path: ./backend/.env
        required: true
      - path: ./backend/db.env
        required: true
    environment:
      ENVIRONMENT: production
      INFO__DEBUG: "true"
      DB__POSTGRESQL__HOST: db
      DB__POSTGRESQL__NAME: keychain_development
      DB__ALEMBIC_INI_PATH: /opt/backend/src/keychain/services/alembic/alembic.ini
      DB__BACKUP_FOLDER_PATH: /opt/backend/backup
    ports:
      - 8080:8080
    volumes:
      - ./backup:/opt/backend/backup
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/keychain/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    # Full image (not -slim): Vite+ needs the system CA certificates
    image: node:24
    profiles:
      - frontend
    working_dir: /opt/app/frontend
    command: ["./scripts/start.sh"]
    volumes:
      - ./frontend:/opt/app/frontend
      # Keep Linux node_modules inside the container, separate from the host's
      - /opt/app/frontend/node_modules
      # Vite writes the bundle to ../static (see frontend/vite.config.ts)
      - ./static:/opt/app/static
    restart: "no"
