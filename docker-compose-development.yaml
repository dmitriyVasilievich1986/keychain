# Local development stack.
#
#   docker compose -f docker-compose-development.yaml up                              # Firestore emulator only
#   docker compose -f docker-compose-development.yaml --profile backend up --build    # emulator + backend
#   docker compose -f docker-compose-development.yaml --profile frontend run --rm frontend
#
# The Firestore emulator is exposed on localhost:8081 and always starts; point a
# locally run backend at it with FIRESTORE_EMULATOR_HOST=localhost:8081. The
# backend is built for the host architecture and exposed on localhost:8080; it
# runs only with the `backend` profile and always talks to the emulator. The
# `frontend` service only builds the bundle into ./static and exits; it runs
# only with the `frontend` profile.
name: keychain-development

services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: ["gcloud", "emulators", "firestore", "start", "--host-port=0.0.0.0:8081"]
    ports:
      - 8081:8081
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081"]
      # Every probe logs "Detected non-HTTP/2 connection", so probe rarely once
      # healthy, but quickly during startup so the backend isn't held back.
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 2s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: keychain:development
    profiles:
      - backend
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      ENVIRONMENT: local
      FIRESTORE_EMULATOR_HOST: firestore:8081
      GOOGLE__CREDENTIALS_PATH: /run/secrets/gcp-key.json
    volumes:
      - ./gcp-key.json:/run/secrets/gcp-key.json:ro
      # local.yaml is excluded from the image (.dockerignore); mount it at runtime
      - ./backend/configurations/local.yaml:/opt/backend/configurations/local.yaml:ro
    ports:
      - 8080:8080
    depends_on:
      firestore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/keychain/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    # Full image (not -slim): Vite+ needs the system CA certificates
    image: node:24
    profiles:
      - frontend
    working_dir: /opt/app/frontend
    command: ["./scripts/start.sh"]
    volumes:
      - ./frontend:/opt/app/frontend
      # Keep Linux node_modules inside the container, separate from the host's
      - /opt/app/frontend/node_modules
      # Vite writes the bundle to ../static (see frontend/vite.config.ts)
      - ./static:/opt/app/static
    restart: "no"
